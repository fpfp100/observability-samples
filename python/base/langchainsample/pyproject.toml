[project]
name = "langchain-sample"
version = "0.1.0"
description = "Sample demonstrating LangChain with A365 base SDK observability and CustomLangChainInstrumentor."
authors = [{ name = "Microsoft", email = "example@microsoft.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # Core SDKs / tracing
  "opentelemetry-sdk>=1.20.0",
  "azure-identity>=1.17.1",
  "azure-monitor-ingestion>=1.0.4",
  "azure-monitor-opentelemetry-exporter==1.0.0b39",
  "azure-monitor-opentelemetry",
  "aiohttp",
  "microsoft-agents-hosting-aiohttp==0.9.0",
  "microsoft-agents-hosting-core==0.9.0",
  "microsoft-agents-authentication-msal==0.9.0",
  "microsoft-agents-activity==0.9.0",
  "microsoft-agents-a365-runtime==0.3.0.dev6",
  "microsoft-agents-a365-observability-core==0.3.0.dev6",
  "microsoft-agents-a365-observability-hosting==0.3.0.dev6",

  # LangChain
  "langchain>=0.3.0",
  "langchain-openai>=0.3.0",
  "microsoft-agents-a365-observability-extensions-langchain==0.3.0.dev6",
  "wrapt<2",  # P-5: extensions-langchain uses wrapt v1.x 'module=' kwarg, renamed to 'target' in v2

  # HTTP/server stack
  "uvicorn[standard]~=0.35.0",
  "starlette>=0.27.0",
  "python-dotenv==1.1.1",

]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "ruff>=0.6.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["__pycache__"]
