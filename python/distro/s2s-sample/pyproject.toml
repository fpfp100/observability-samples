[project]
name = "s2s-observability-sample"
version = "0.1.0"
description = "Sample demonstrating S2S (Server-to-Server) token acquisition for Agent365 observability exporter."
authors = [{ name = "Microsoft", email = "example@microsoft.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp",
  "microsoft-agents-hosting-aiohttp==0.9.0",
  "microsoft-agents-hosting-core==0.9.0",
  "microsoft-agents-authentication-msal==0.9.0",
  "microsoft-agents-activity==0.9.0",
  "microsoft-agents-a365-runtime==0.3.0.dev6",

  # OTel Distro
  "microsoft-opentelemetry==0.1.0b3",

  # MSAL for S2S token exchange
  "msal>=1.28.0",

  # HTTP/server stack
  "uvicorn[standard]~=0.35.0",
  "starlette>=0.27.0",
  "python-dotenv==1.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "ruff>=0.6.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["__pycache__"]

# The SDK library packages use a custom build backend (versioning/helper/build_backend.py).
# Before running `uv sync`, set PYTHONPATH so the backend is discoverable:
#   $env:PYTHONPATH = "../../versioning/helper"   (PowerShell)
#   export PYTHONPATH="../../versioning/helper"    (bash)
